appId: com.quantlab.desktop
productName: Quant Lab
directories:
  output: release
files:
  - dist/production/**
  - dist/electron/**
  - package.json
asar: true
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
